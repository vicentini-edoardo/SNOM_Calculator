name: keepalive
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # shortcut: plain GET may not wake a sleeping app, upgrade to a Playwright page load if it still sleeps
      - run: curl -fsS https://snomcalculator.streamlit.app/ > /dev/null
