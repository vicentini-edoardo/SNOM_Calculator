[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snom-calculator"
version = "0.1.0"
description = "Streamlit calculator for bulk and multilayer spheroid s-SNOM models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Edoardo Vicentini" }, { name = "Kirill Voronin" }]
requires-python = ">=3.11,<3.14"
dependencies = [
  "numba>=0.59",
  "numpy>=1.24",
  "scipy>=1.10",
  "streamlit>=1.56",
  "plotly>=5.20",
  "materials-library @ https://github.com/vicentini-edoardo/Materials_Library/archive/b27b08b328c6623bdd331d429ccef2f0e15ede81.zip",
]

[project.urls]
Repository = "https://github.com/vicentini-edoardo/SNOM_Calculator"
Issues = "https://github.com/vicentini-edoardo/SNOM_Calculator/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
